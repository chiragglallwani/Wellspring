services:
  backend:
    build:
      context: .
    command: npm run dev
    env_file:
      - .env.local
    environment:
      # Must be reachable from the host browser (not the Docker network hostname).
      S3_PUBLIC_ENDPOINT: http://localhost:9000
    ports:
      - "4443:4443"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
      minio:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wellspring
      POSTGRES_USER: wellspring
      POSTGRES_PASSWORD: wellspring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellspring -d wellspring"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
      # Allow browser uploads via presigned URLs from the Next.js dev server
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  backend_node_modules:
  postgres_data:
  minio_data:
